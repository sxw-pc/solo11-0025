# Synthetic metric dictionary for the offline demo. All names are fictional.
version: 1
metrics:
  - metric: order_gmv
    owner: growth_analytics
    description: 支付成功订单的成交金额合计
    source_tables:
      - fact_order
    source_fields:
      - pay_amount
      - order_paid_at
      - order_status
    aggregation: sum
    filter_expr: "order_status = 'paid'"
    granularity: day
    version: 1.4.0

  - metric: active_user
    owner: growth_analytics
    description: 当日登录成功且状态正常的去重用户数
    source_tables:
      - fact_login
    source_fields:
      - user_id
      - login_at
      - event_type
      - status
    aggregation: count_distinct
    filter_expr: "event_type = 'login' and status = 'ok'"
    granularity: day
    version: 1.2.0

  - metric: paid_order_count
    owner: trade_operations
    description: 支付成功的去重订单数
    source_tables:
      - fact_order
    source_fields:
      - order_id
      - order_paid_at
      - order_status
    aggregation: count_distinct
    filter_expr: "order_status = 'paid'"
    granularity: day
    version: 2.0.0
